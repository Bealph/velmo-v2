name: quality

# Boucle qualité (dossier 03-mlops.md, D27/D29). L'éval est OFFLINE et déterministe
# (EchoLLM, temperature 0) → le gate tourne SANS secret. Déclencheurs :
#   - push feat/** | feature/**  : feedback rapide, NON bloquant pour la livraison
#   - pull_request vers main     : LA porte de livraison, BLOQUANTE (seuil + planchers)
#   - tag v*                     : une VERSION → éval + ledger commit-back (D31)
on:
  push:
    branches: ['feat/**', 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire au commit-back du ledger sur un tag
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      # Garde-fou de non-régression : la suite d'acceptance doit rester verte.
      - name: Acceptance suite
        run: uv run pytest tests/acceptance/ -q

      # Les 3 étapes de mesure/diagnostic tournent avec `if: always()` : on veut les
      # signaux qualité ET le rapport MÊME quand l'acceptance échoue — c'est précisément
      # là qu'ils sont utiles (diagnostiquer POURQUOI). Observé lors de la démo de
      # régression : la CI virait rouge mais Eval/report étaient sautés, donc aucun
      # rapport pour comprendre la chute. `always()` ne masque rien : le job reste rouge
      # si l'acceptance ou la porte a échoué (un seul step rouge suffit à faire échouer
      # le job). Le Versionnage, lui, garde son `success()` implicite → aucun ledger
      # publié pour une version cassée.

      # 1. Les 3 suites → notes (JSON déterministe)
      - name: Eval (3 suites -> scores.json)
        if: always()
        run: uv run python -m velmo.mlops.eval --out results/scores.json

      # 2. PORTE QUALITÉ : exit 1 si note < seuil OU plancher violé → job rouge = merge bloqué
      - name: Porte qualite (bloquante)
        if: always()
        run: uv run python -m velmo.mlops.score results/scores.json --min-global 90

      # 3. Rapport lisible → artefact téléchargeable
      - name: Generer report.md
        if: always()
        run: uv run python -m velmo.mlops.report results/scores.json --out mlops/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: mlops/report.md

      # 4. Versionnage — SEULEMENT sur un tag : ledger sur branche dédiée (D31 révisé)
      #
      # Le ledger ne va PAS sur `main` : `main` exige un check `quality-gate` vert, et le
      # commit du bot n'en a pas → « GH006: protected branch update failed ». Les deux
      # décisions (commit-back D31 et protection de branche) étaient incompatibles.
      # Un historique de notes n'est de toute façon pas du code source : il vit sur sa
      # propre branche, non protégée. Git reste la source de vérité (intention de D31),
      # et `main` reste inviolable.
      #
      # Point d'attention : l'arbre du tag ne contient PAS scores.jsonl (on ne pousse
      # jamais sur main). Sans récupérer d'abord le ledger existant, chaque version
      # repartirait d'un fichier vide — un « historique » d'une seule ligne.
      - name: Versionnage (ledger sur branche dediee)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          git config user.name  "velmo-ci[bot]"
          git config user.email "ci@velmo.local"

          # a) récupérer le ledger cumulé, s'il existe déjà
          git fetch origin mlops-ledger || true
          git checkout origin/mlops-ledger -- mlops/scores.jsonl 2>/dev/null || true

          # b) ajouter la ligne de cette version (code du tag, donc à jour)
          uv run python -m velmo.mlops.ledger append results/scores.json \
            --version "${{ github.ref_name }}" --commit "${{ github.sha }}"
          cp mlops/scores.jsonl "$RUNNER_TEMP/scores.jsonl"

          # c) publier sur la branche ledger, en CHAÎNANT son historique (pas de force)
          if git rev-parse --verify origin/mlops-ledger >/dev/null 2>&1; then
            git checkout -f -B mlops-ledger origin/mlops-ledger
          else
            git checkout -f -B mlops-ledger
          fi
          mkdir -p mlops && cp "$RUNNER_TEMP/scores.jsonl" mlops/scores.jsonl
          git add mlops/scores.jsonl
          git commit -m "chore(mlops): note ${{ github.ref_name }} [skip ci]"
          git push origin mlops-ledger
