services:
  app:
    build: .
    image: velmo-v2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    # Conteneur maintenu actif ; ouvrir le chat avec :
    #   docker compose exec app uv run python -m velmo.cli
    command: ["tail", "-f", "/dev/null"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: velmo
    ports:
      - "5432:5432"
    volumes:
      # Volume Docker NOMME (et non un bind mount dans le repo) : le repertoire de
      # donnees PostgreSQL ne doit pas vivre dans un dossier synchronise (OneDrive) —
      # la synchro concurrente interrompait l'initialisation du cluster (base jamais
      # creee, pg_hba incomplet). Ici les donnees vivent dans la VM Docker.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d velmo"]
      interval: 5s
      timeout: 5s
      retries: 20   # la toute premiere initialisation peut depasser 50 s

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - .docker-data/chroma:/chroma/chroma

volumes:
  pgdata:   # donnees PostgreSQL, hors du repo et hors OneDrive
